[project]
name = "fast-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "HiroDesuPY",email = "takahashi.rafael06@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.3,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.ruff]
line-length=79

[tool.ruff.lint]
preview=true
select = ['I','F','E','W','PL','PT']

[tool.ruff.format]
preview=true
quote-style='single'

[tool.pytest.ini.options]
pythonpath="."
addopts='-p no:warnings'

[tool.taskipy.tasks]
lint='ruff check'
pre_format='ruff check --fix'
format='ruff format'
run='fastapi dev fast_zero/app.py'

pre_test='task lint'
test='pytest -s -x --cov=fast_zero -vv'
post_test='coverage html'

